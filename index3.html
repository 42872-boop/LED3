<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine Image Model</title>
    <!-- นำเข้า Tailwind CSS เพื่อความสวยงาม -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-6">

    <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full text-center border border-gray-100">
        <h1 class="text-2xl font-semibold text-gray-800 mb-2">Teachable Machine</h1>
        <p class="text-sm text-gray-500 mb-6">ระบบวิเคราะห์รูปภาพผ่านกล้อง (อัปเดตทุก 3 วินาที)</p>
        
        <!-- ปุ่มควบคุม -->
        <button type="button" onclick="init()" id="start-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-6 rounded-xl transition duration-200 shadow-lg shadow-blue-200 active:scale-[0.98]">
            เริ่มใช้งานกล้อง
        </button>

        <!-- ส่วนแสดงผลกล้อง -->
        <div id="webcam-container" class="mt-6 flex justify-center overflow-hidden rounded-xl bg-gray-100 border-2 border-dashed border-gray-200 aspect-square items-center hidden">
            <!-- กล้องจะถูกใส่เข้ามาที่นี่ -->
        </div>

        <!-- ส่วนแสดงผลลัพธ์การทำนาย -->
        <div id="label-container" class="mt-6 space-y-3 text-left"></div>
    </div>

    <!-- สคริปต์ของ TensorFlow และ Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    
    <script type="text/javascript">
        // ลิงก์โมเดลของคุณจาก Teachable Machine
        const URL = "./my_model/";

        let model, webcam, labelContainer, maxPredictions;
        let predictInterval; // ตัวแปรสำหรับเก็บรอบการทำงานทุก 3 วินาที

        async function init() {
            // ซ่อนปุ่มเริ่มและแสดงพื้นที่กล้อง
            const startBtn = document.getElementById("start-btn");
            startBtn.disabled = true;
            startBtn.innerText = "กำลังโหลดโมเดล...";
            
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            // ตั้งค่ากล้อง
            const flip = true; 
            webcam = new tmImage.Webcam(350, 350, flip); // ปรับขนาดกล้องให้ใหญ่ขึ้นเล็กน้อยเพื่อให้เข้ากับ UI
            await webcam.setup(); 
            await webcam.play();

            // แสดงหน้าต่างกล้อง
            const webcamContainer = document.getElementById("webcam-container");
            webcamContainer.classList.remove("hidden");
            webcamContainer.innerHTML = ""; // ล้างข้อมูลเก่า
            webcamContainer.appendChild(webcam.canvas);

            // เริ่มการอัปเดตเฟรมภาพของกล้องเพื่อให้ภาพเคลื่อนไหวลื่นไหล
            window.requestAnimationFrame(loop);

            // ตั้งค่าจุดแสดงผลลัพธ์
            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = ""; // ล้างข้อมูลเก่า
            for (let i = 0; i < maxPredictions; i++) {
                // สร้างโครงสร้างสำหรับแถบความแม่นยำ (Progress Bar)
                const itemDiv = document.createElement("div");
                itemDiv.className = "bg-gray-50 p-3 rounded-lg border border-gray-100";
                itemDiv.innerHTML = `
                    <div class="flex justify-between text-sm font-medium text-gray-700 mb-1">
                        <span class="class-name">-</span>
                        <span class="class-prob">0%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2">
                        <div class="bg-blue-600 h-2 rounded-full class-bar" style="width: 0%"></div>
                    </div>
                `;
                labelContainer.appendChild(itemDiv);
            }

            // เปลี่ยนข้อความบนปุ่ม
            startBtn.innerText = "ระบบกำลังทำงาน...";
            startBtn.className = "w-full bg-green-600 text-white font-medium py-3 px-6 rounded-xl cursor-not-allowed opacity-80";

            // สั่งให้ฟังก์ชัน predict ทำงานทุก ๆ 3 วินาที (3000 มิลลิวินาที)
            if (predictInterval) clearInterval(predictInterval);
            predictInterval = setInterval(async () => {
                await predict();
            }, 3000);
            
            // ให้ทำนายครั้งแรกทันทีโดยไม่ต้องรอครบ 3 วินาทีแรก
            await predict();
        }

        async function loop() {
            webcam.update(); // ทำการอัปเดตภาพจากกล้องให้เคลื่อนไหวตลอดเวลา
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            const items = labelContainer.childNodes;

            for (let i = 0; i < maxPredictions; i++) {
                const className = prediction[i].className;
                const probability = prediction[i].probability;
                const percentage = (probability * 100).toFixed(0);

                // อัปเดตข้อความและแถบความแม่นยำใน UI
                items[i].querySelector(".class-name").innerText = className;
                items[i].querySelector(".class-prob").innerText = percentage + "%";
                items[i].querySelector(".class-bar").style.width = percentage + "%";
            }
        }
    </script>
</body>
</html>
